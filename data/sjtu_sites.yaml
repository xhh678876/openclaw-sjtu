# SJTU 全站信息源种子清单 (Layers 1-3)
# type: jwc | grad | student | career | library | it | department | platform
# list_url: 通知/新闻列表页; item_selector: 列表项 CSS; title_selector / date_selector / link_selector 相对 item
# detail_selector: 正文容器; date_fmt: 日期解析格式
# encoding: 部分老站是 utf-8 / gb2312
# update_freq: daily | weekly
# notes: 备注

defaults:
  item_selector: "ul.list_main_content li, ul.wp_article_list li, .news_list li, li.news"
  title_selector: "a"
  link_selector: "a"
  date_selector: ".time, .date, .news_meta, span"
  detail_selector: ".wp_articlecontent, .v_news_content, #vsb_content, .article, .content, #content"
  encoding: "utf-8"
  update_freq: "daily"

